# Fly.io configuration for the Atlantean Python backend.
# Deploy with: fly deploy --config fly.toml

app = "studious-enigma"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8080"
  SESSION_COOKIE_SECURE = "1"

# Secrets (set via CLI, never commit values here):
#   fly secrets set GEMINI_API_KEY=...
#   fly secrets set ATLANTEAN_SESSION_SECRET=...
#   fly secrets set ALLOWED_ORIGINS=https://your-app.vercel.app

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

[checks]
  [checks.health]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "10s"
    type = "http"
